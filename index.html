<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment - 4</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#f8fafc]">
    <!-- header part -->
    <header class="max-w-[1200px] mx-auto px-4 border-b-2 border-gray-200 space-y-7">
        <h2 class="text-3xl font-bold pt-7 text-[#002c5c]">Job Application Tracker</h2>
        
        <div class="top-cards grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-5">
            <div class="total-card bg-white p-5 rounded-2xl transition duration-300 hover:-translate-y-2 hover:shadow-xl cursor-pointer">
                <p class="text-lg">Total</p>
                <h3 id="total-count" class="font-bold text-3xl">0</h3>
            </div>
            <div class="interview-card bg-white p-5 rounded-2xl transition duration-300 hover:-translate-y-2 hover:shadow-xl cursor-pointer">
                <p class="text-lg">Interview</p>
                <h3 id="interview-count" class="font-bold text-3xl text-green-600">0</h3>
            </div>
            <div class="reject-card bg-white p-5 rounded-2xl transition duration-300 hover:-translate-y-2 hover:shadow-xl cursor-pointer">
                <p class="text-lg">Rejected</p>
                <h3 id="reject-count" class="font-bold text-3xl text-red-600">0</h3>
            </div>
        </div>

    </header>

    <!-- Main part -->
    <main class="max-w-[1200px] mx-auto px-4 space-y-7">
        <div class="main-top pt-7">
            <div class="main-title flex justify-between items-center">
                <h2 class="font-bold text-xl text-[#002c5c]">Available Jobs</h2>
                <p id="filter-counts" class="text-xl font-bold text-gray-500">0 Jobs</p>
            </div>
            <div class="buttons pt-5 flex flex-col sm:flex-row gap-4">
                <div class="btn-1 px-7 py-2 bg-blue-600 text-white rounded">
                    <button id="all-filter-btn">All</button>
                </div>
                <div class="btn-2 px-7 py-2 bg-blue-100 text-blue-800 rounded">
                    <button id="interview-filter-btn">Interview</button>
                </div>
                <div class="btn-3 px-7 py-2 bg-blue-100 text-blue-800 rounded">
                    <button id="reject-filter-btn">Rejected</button>
                </div>
            </div>
        </div>
        

    </main>
    


    <script src="./script.js"></script>     
</body>
</html>
